[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "beltloop"
version = "0.1.0"
description = "Longitudinal modal analysis of belt-conveyor loops with a gravity take-up at an arbitrary position"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]
plots = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
